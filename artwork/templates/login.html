{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back 👋</h1>
        <p>Login to continue using ArtSense AI</p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>

    </div>

</div>

{% endblock %}
