{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>
        <p>Join ArtSense AI</p>

        
    </div>

        <form method="POST">

            {% csrf_token %}

            {% if form.errors %}
                <div style="color:red;">
                {{ form.errors }}
                </div>
            {% endif %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Sign Up
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
