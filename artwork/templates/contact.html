{% extends 'base.html' %}

{% block title %}
Contact
{% endblock %}

{% block content %}

<div class="contact-container">

    <h1>Contact Us</h1>

    <p>
        Have questions or suggestions? We'd love to hear from you.
    </p>

    {% if success %}

        <div class="success-message">
            ✅ Thank you! Your message has been sent successfully.
        </div>

    {% endif %}

    <form method="POST" class="contact-form">

    {% csrf_token %}

    <input
        type="text"
        name="name"
        placeholder="Your Name"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Your Email"
        required
    >

    <input
        type="text"
        name="subject"
        placeholder="Subject"
        required
    >

    <textarea
        name="message"
        rows="6"
        placeholder="Your Message"
        required
    ></textarea>

    <button type="submit" class="btn">
        Send Message
    </button>

</form>

</div>

{% endblock %}
